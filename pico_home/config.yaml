name: Pico Home
version: "0.2.0"
slug: pico_home
description: A place where your Pico lives, on your own Home Assistant.
url: https://github.com/riederch/pico
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
image: ghcr.io/riederch/pico/home
ingress: true
ingress_port: 3100
ingress_entry: /
ingress_stream: true
panel_title: Pico Home
panel_admin: true
# Only options with a real default belong here. A `null` default is not the
# same as "unset": the Supervisor reads it back as a missing value and rejects
# the app before it starts, even when the schema marks the option optional.
# An optional option with no default is declared in `schema` alone, which is
# what `applyPicoHomeAssistantAppOptions` already expects (it treats a missing,
# null or blank token as "no token" and stays in ingress mode).
# `memory_encryption` is retiring (ADR 0104 S3, decided 2026-08-14). The
# decision now lives in Pico, in `pico_memory_encryption_decision`, and is set
# through the Foundation surface rather than here.
#
# Removing it does not strand anybody: with no variable passed, the boot asks
# the store what it holds, and a Home with `domain_encrypted` content inherits
# encryption rather than reading absence as "off". This option stays for one
# release for the one case that leaves no trace - encryption on and nothing
# encrypted yet - and the release after that removes it.
#
# Do not add a person-facing option here. ADR 0104 S2 makes that a defect.
options:
  memory_encryption: false
schema:
  pico_foundation_token: password?
  memory_encryption: bool?
ports:
  3100/tcp: null
ports_description:
  3100/tcp: Pico Home internal ingress, API and WebSocket endpoint
watchdog: "http://[HOST]:[PORT:3100]/health"
# Memory Domain Content Keys live under /data/keys (ADR 0072 R6). Pico Home
# host identity keys live under /data/home-host-keys (ADR 0080 H5). Neither key
# family may share a backup artifact with the database. Keys are not recoverable
# from a data backup by design; recovery is a deliberate, separate key export or
# continuity flow.
#
# /data/recovery-anchor is excluded for the opposite reason (ADR 0110 R6): it
# must NOT travel with a backup. It records which device recoveries this Home
# accepted and resolved, so a restored database cannot resurrect a recovery
# that was already consumed or vetoed. Including it here would restore the
# anchor alongside the rows it is supposed to outlive.
backup_exclude:
  - keys/**
  - keys
  - home-host-keys/**
  - home-host-keys
  - recovery-anchor/**
  - recovery-anchor
