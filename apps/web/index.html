<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pico Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(34, 211, 238, 0.22), transparent 32rem),
          radial-gradient(circle at 80% 0%, rgba(124, 58, 237, 0.18), transparent 28rem),
          #020617;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(32px, 5vw, 56px);
        letter-spacing: -0.05em;
      }

      h2 {
        font-size: 18px;
        margin-bottom: 14px;
      }

      .subtitle {
        margin-top: 8px;
        color: #94a3b8;
      }

      .controls {
        display: grid;
        gap: 8px;
        min-width: min(420px, 100%);
      }

      label {
        color: #94a3b8;
        font-size: 13px;
      }

      input,
      button {
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
      }

      input {
        background: rgba(15, 23, 42, 0.8);
        color: #e2e8f0;
      }

      button {
        cursor: pointer;
        color: #06111f;
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }

      .card {
        grid-column: span 6;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
        padding: 18px;
        backdrop-filter: blur(18px);
      }

      .card.full {
        grid-column: 1 / -1;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      .status-row:first-of-type {
        border-top: 0;
      }

      .key {
        color: #94a3b8;
      }

      .value {
        color: #e2e8f0;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(15, 23, 42, 0.9);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.18);
        font-size: 13px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #64748b;
      }

      .dot.ok {
        background: #22c55e;
      }

      .dot.warn {
        background: #f59e0b;
      }

      .dot.error {
        background: #ef4444;
      }

      pre {
        overflow: auto;
        max-height: 420px;
        margin: 0;
        padding: 14px;
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .event-list {
        display: grid;
        gap: 10px;
      }

      .event {
        padding: 12px;
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.56);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .event strong {
        display: block;
        margin-bottom: 6px;
      }

      .muted {
        color: #94a3b8;
      }

      @media (max-width: 760px) {
        header {
          display: grid;
        }

        .card {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <section>
          <h1>Pico Dashboard</h1>
          <p class="subtitle">Foundation status, events and realtime Core connection.</p>
        </section>
        <section class="controls" aria-label="Connection controls">
          <label for="core-url">Pico Core URL</label>
          <input id="core-url" type="url" value="http://localhost:3100" spellcheck="false" />
          <button id="connect-button" type="button">Connect</button>
        </section>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Connection</h2>
          <div class="status-row"><span class="key">HTTP</span><span class="value"><span id="http-status" class="pill"><span class="dot"></span>not checked</span></span></div>
          <div class="status-row"><span class="key">WebSocket</span><span class="value"><span id="ws-status" class="pill"><span class="dot"></span>disconnected</span></span></div>
          <div class="status-row"><span class="key">Last update</span><span id="last-update" class="value">never</span></div>
        </article>

        <article class="card">
          <h2>Core</h2>
          <div id="core-summary">
            <p class="muted">Connect to Pico Core to load status.</p>
          </div>
        </article>

        <article class="card full">
          <h2>Database</h2>
          <div id="database-summary">
            <p class="muted">No database status loaded yet.</p>
          </div>
        </article>

        <article class="card full">
          <h2>Events</h2>
          <div id="event-list" class="event-list">
            <p class="muted">No events loaded yet.</p>
          </div>
        </article>

        <article class="card full">
          <h2>Raw status</h2>
          <pre id="raw-status">{}</pre>
        </article>
      </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
