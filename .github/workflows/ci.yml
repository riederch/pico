name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# ADR 0122 Y1. A tag is movable, so every one of these is pinned to the commit
# it resolved to, with the human-readable version kept as a comment. The commit
# is what determines the build; the tag only says what someone called it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # ADR 0122 Y1. Install scripts stay enabled, and the exception is
      # recorded here rather than remembered: better-sqlite3 is a native module
      # whose build runs during install, so turning script execution off would
      # not harden this build - it would stop it. What carries the weight
      # instead is the frozen lockfile with per-package integrity hashes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0122 Y1. Beside `release:verify`, not inside it: a known advisory
      # is a fact about the world on the day of the build, and folding it into
      # the gate would make an unrelated disclosure look like a broken tree.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type check, test and build
        env:
          PICO_COMPANION_ROOT_OWNED_PACKAGE_PROBE: "1"
        run: pnpm release:verify

  container:
    name: Build and smoke-test Pico Core container
    runs-on: ubuntu-latest
    needs: verify
    # ADR 0122 Y1. These live on the one job that publishes, rather than on
    # the workflow where the verify job would inherit permissions it has no use
    # for.
    #
    # ADR 0122 Y2 needs two more than publishing does, and both are easy to
    # miss because neither is named after what it does here:
    #
    # - `id-token: write` is what makes `ACTIONS_ID_TOKEN_REQUEST_URL` exist.
    #   Without it the attestation cannot get the OIDC token Sigstore signs
    #   against, and the step fails before it has looked at the image at all.
    # - `attestations: write` is what lets the finished attestation be
    #   recorded. Missing it fails later than the token does, which is worse:
    #   the build has already published by then.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-tag.mjs

      # ADR 0122 Y4. Before the build, not after: a refusal is only useful
      # while nothing has been pushed. Nothing here makes a GHCR tag immutable
      # - it removes the legitimate path to a moved one, so a version whose
      # bytes change is always evidence rather than possibly a re-run.
      - name: Verify the release neither republishes nor downgrades
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-monotonic.mjs

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/riederch/pico/core
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build local amd64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/core.Dockerfile
          load: true
          platforms: linux/amd64
          tags: pico-core:amd64-test

      - name: Smoke-test amd64 container health endpoint and dashboard
        run: |
          docker run --rm -d --name pico-core-smoke-amd64 -p 3100:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -e PICO_FOUNDATION_TOKEN=ci-smoke-token pico-core:amd64-test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/health && curl -fsS http://127.0.0.1:3100/ | grep -q "Pico Home Foundation Dashboard"; then
              docker stop pico-core-smoke-amd64
              exit 0
            fi
            sleep 1
          done
          docker logs pico-core-smoke-amd64 || true
          docker stop pico-core-smoke-amd64 || true
          exit 1

      - name: Smoke-test amd64 add-on foundation token option
        run: |
          mkdir -p /tmp/pico-addon-options-amd64
          printf '{"pico_foundation_token":"ci-token"}\n' > /tmp/pico-addon-options-amd64/options.json
          docker run --rm -d --name pico-core-token-amd64 -p 3102:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -v /tmp/pico-addon-options-amd64:/data pico-core:amd64-test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3102/health; then
              status_without_token=$(curl -sS -o /tmp/pico-token-amd64-without-token.txt -w '%{http_code}' http://127.0.0.1:3102/api/system/status || true)
              if [ "$status_without_token" = "401" ] && curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:3102/api/system/status | grep -q '"service":"pico-home-core"'; then
                docker stop pico-core-token-amd64
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs pico-core-token-amd64 || true
          docker stop pico-core-token-amd64 || true
          exit 1

      - name: Build local arm64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/core.Dockerfile
          load: true
          platforms: linux/arm64
          tags: pico-core:arm64-test

      - name: Smoke-test arm64 container health endpoint and dashboard
        run: |
          docker run --platform linux/arm64 --rm -d --name pico-core-smoke-arm64 -p 3101:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -e PICO_FOUNDATION_TOKEN=ci-smoke-token pico-core:arm64-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health && curl -fsS http://127.0.0.1:3101/ | grep -q "Pico Home Foundation Dashboard"; then
              docker stop pico-core-smoke-arm64
              exit 0
            fi
            sleep 1
          done
          docker logs pico-core-smoke-arm64 || true
          docker stop pico-core-smoke-arm64 || true
          exit 1

      - name: Smoke-test arm64 add-on foundation token option
        run: |
          mkdir -p /tmp/pico-addon-options-arm64
          printf '{"pico_foundation_token":"ci-token"}\n' > /tmp/pico-addon-options-arm64/options.json
          docker run --platform linux/arm64 --rm -d --name pico-core-token-arm64 -p 3103:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -v /tmp/pico-addon-options-arm64:/data pico-core:arm64-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3103/health; then
              status_without_token=$(curl -sS -o /tmp/pico-token-arm64-without-token.txt -w '%{http_code}' http://127.0.0.1:3103/api/system/status || true)
              if [ "$status_without_token" = "401" ] && curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:3103/api/system/status | grep -q '"service":"pico-home-core"'; then
                docker stop pico-core-token-arm64
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs pico-core-token-arm64 || true
          docker stop pico-core-token-arm64 || true
          exit 1

      - name: Build and optionally push multi-arch release image
        id: release_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/core.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ADR 0122 Y2. Provenance from the platform's own Sigstore-backed
      # tooling. No Pico-held signing key is created, deliberately: for every
      # consumption path that exists today the update authority is already
      # repository plus registry write access, and a key Pico held would add a
      # ceremony without moving that root of trust.
      #
      # Conditional on the repository being public, because GitHub refuses to
      # store an attestation for a user-owned private repository:
      #
      #   Failed to persist attestation: Feature not available for user-owned
      #   private repositories.
      #
      # That is a platform limit, not a build failure, and the two must not
      # look the same. Failing every push would make a wall out of a gate;
      # skipping quietly would let a build with no provenance look like one
      # that has it. So it is skipped and said out loud in the job summary,
      # in the ADR 0119 Q5 posture: told while there is still room to act.
      #
      # The two things that would actually produce provenance are a public
      # repository or an organisation-owned one. Both are decisions about the
      # project rather than about this file.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/riederch/pico/core
          subject-digest: ${{ steps.release_image.outputs.digest }}
          push-to-registry: true

      # ADR 0122 Y2. The skip is recorded where a person reading the run will
      # meet it, rather than being inferable from a step that is not there.
      - name: Report that build provenance was not attested
        if: github.event_name != 'pull_request' && github.event.repository.private == true
        run: |
          {
            echo "### Build provenance: not attested"
            echo
            echo "This image carries **no build-provenance attestation**."
            echo "GitHub does not store attestations for user-owned private"
            echo "repositories, so ADR 0122 Y2 is unmet for this build."
            echo
            echo "Provenance would require a public repository or an"
            echo "organisation-owned one. Until then, the update authority for"
            echo "every consumption path is repository plus registry write"
            echo "access, unattested."
          } >> "$GITHUB_STEP_SUMMARY"

      # ADR 0122 Y3. The digest the release notes have to record, produced by
      # the build rather than copied by hand from a terminal.
      - name: Report the published digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/riederch/pico/core@${{ steps.release_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
