name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check, test and build
        run: pnpm release:verify

  container:
    name: Build and smoke-test Pico Core container
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/riederch/pico/core
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=0.1.0,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build local smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/core.Dockerfile
          load: true
          platforms: linux/amd64
          tags: pico-core:test

      - name: Smoke-test container health endpoint
        run: |
          docker run --rm -d --name pico-core-smoke -p 3100:3100 pico-core:test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/health; then
              docker stop pico-core-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs pico-core-smoke || true
          docker stop pico-core-smoke || true
          exit 1

      - name: Build and optionally push multi-arch release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/core.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
