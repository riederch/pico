name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# ADR 0122 Y1. A tag is movable, so every one of these is pinned to the commit
# it resolved to, with the human-readable version kept as a comment. The commit
# is what determines the build; the tag only says what someone called it.
permissions:
  contents: read

jobs:
  verify:
    name: Verify release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # ADR 0122 Y1. Install scripts stay enabled, and the exception is
      # recorded here rather than remembered: better-sqlite3 is a native module
      # whose build runs during install, so turning script execution off would
      # not harden this build - it would stop it. What carries the weight
      # instead is the frozen lockfile with per-package integrity hashes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0122 Y1. Beside `release:verify`, not inside it: a known advisory
      # is a fact about the world on the day of the build, and folding it into
      # the gate would make an unrelated disclosure look like a broken tree.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      # ADR 0113 C3. Chromiums Namensraum-Sandbox braucht unprivilegierte
      # User-Namespaces, und Ubuntu 24.04 sperrt sie fuer unconfined Programme
      # per AppArmor. Ohne diese Zeile faellt jeder Electron-Start hier zurueck
      # auf den setuid-Helfer, der in einem ausgepackten `node_modules` nicht
      # root gehoert - genau der Abbruch vom 2026-09-02 (Befund B62).
      #
      # Die Alternative waere `--no-sandbox`, und die ist keine: dieses Haus
      # verbietet sie auf jeder Produktionsflaeche, und ein Rauchtest, der die
      # Sandbox abschaltet, prueft eine andere Lage als die ausgelieferte.
      #
      # Ob dieser Schritt ueberhaupt etwas hebt, war bis zum 2026-09-04
      # unbekannt: der Rauchtest kam nie bis zu Chromium (Befund B64), also
      # hat der Laeufer die Frage nie beantwortet. Er sagt jetzt, was er
      # vorfand, statt ihn nur zu setzen - sonst liest der Rauchtest daneben
      # eine Null, die dieser Schritt selbst geschrieben hat.
      #
      # Der Schalter existiert nur, wo AppArmor ihn mitbringt. `sysctl -w`
      # endet auf einem Kernel ohne ihn mit 1 und risse diesen Auftrag aus
      # einem *neuen* Grund - dieselbe Umgebungsannahme, nur eine Zeile
      # weiter. Deshalb wird er gesucht statt vorausgesetzt, und der Schritt
      # sagt, in welcher der beiden Welten er steht. Ein `|| true` daneben
      # verstecke stattdessen auch ein kaputtes `sudo`.
      - name: Allow the Chromium namespace sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no AppArmor userns restriction on this image; nothing to lift"
          fi

      # Die Tore ohne die drei Testdurchgaenge - die stehen im Auftrag
      # darunter, nebeneinander statt hintereinander (Befund B67). Dass keine
      # der beiden Haelften einen Schritt verliert, haelt `split:check`
      # innerhalb dieses Laufs.
      - name: Run the release gates
        env:
          PICO_COMPANION_ROOT_OWNED_PACKAGE_PROBE: "1"
        run: pnpm verify:gates

      # ADR 0153 PK6. `release:verify` builds this package and takes it apart
      # again, byte by byte, to check it. Keeping it means the artifact a
      # person downloads is the one that was verified - not a second build
      # made for publishing, which is one build of one artifact too many.
      - name: Keep the verified client package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pico-client-linux-amd64
          path: |
            apps/companion-shell/out/*.deb
            apps/companion-shell/out/*.deb.sha256
          if-no-files-found: error
          retention-days: 7

  # ADR 0122 Y1 mit Befund B67. Dieselbe Testmenge dreimal - normal, unter
  # verschobener Uhr, an den beiden Enden des Tages - macht 92 Prozent der
  # Kette aus, und die drei wissen voneinander nichts. Sie standen bis zum
  # 2026-09-05 hintereinander in einem Auftrag von 58 Minuten.
  #
  # `fail-fast: false`, weil die vier Laeufe vier verschiedene Fragen
  # beantworten: welcher rot ist, sagt etwas anderes, und ein abgebrochener
  # Nachbar sagt gar nichts.
  #
  # Jeder Laeufer baut selbst. Der Bau ist hier Voraussetzung und nicht das
  # Tor - das Tor ist der eine Lauf im Auftrag darueber, und `split:check`
  # kennt den Unterschied.
  suites:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test suite
            verify: pnpm test
          - name: Test suite under a shifted clock
            verify: pnpm clock:check
          - name: Test suite in Pacific/Kiritimati
            verify: pnpm display-zone:check Pacific/Kiritimati
          - name: Test suite in Pacific/Niue
            verify: pnpm display-zone:check Pacific/Niue

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: ${{ matrix.name }}
        run: ${{ matrix.verify }}

  home_image:
    name: Build and smoke-test the Pico Home container
    runs-on: ubuntu-latest
    needs: [verify, suites]
    # ADR 0122 Y1. These live on the one job that publishes, rather than on
    # the workflow where the verify job would inherit permissions it has no use
    # for.
    #
    # ADR 0122 Y2 needs two more than publishing does, and both are easy to
    # miss because neither is named after what it does here:
    #
    # - `id-token: write` is what makes `ACTIONS_ID_TOKEN_REQUEST_URL` exist.
    #   Without it the attestation cannot get the OIDC token Sigstore signs
    #   against, and the step fails before it has looked at the image at all.
    # - `attestations: write` is what lets the finished attestation be
    #   recorded. Missing it fails later than the token does, which is worse:
    #   the build has already published by then.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ueber den Skriptnamen und nicht am ihm vorbei: `release:tag-check` war
      # der einzige der 90 Skripte dieses Baums ohne jeden Aufrufer, weil hier
      # die Datei direkt stand. Zwei Wege zu einer Pruefung heissen, dass der
      # eine sich aendern kann, ohne dass der andere es merkt (2026-09-02).
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: pnpm release:tag-check

      # ADR 0122 Y4. Before the build, not after: a refusal is only useful
      # while nothing has been pushed. Nothing here makes a GHCR tag immutable
      # - it removes the legitimate path to a moved one, so a version whose
      # bytes change is always evidence rather than possibly a re-run.
      - name: Verify the release neither republishes nor downgrades
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-monotonic.mjs

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/riederch/pico/home
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # ADR 0153 PK6, eine Fläche weiter (Befund B67, 2026-09-05). Der Satz
      # steht für das Client-Paket schon da: „the artifact a person downloads
      # is the one that was verified - not a second build made for publishing".
      # Hier galt er nicht. Das Bild wurde zweimal gebaut - einmal geladen und
      # rauchgetestet, einmal fuer die Veroeffentlichung - und was
      # veroeffentlicht wurde, hatte niemand angefasst.
      #
      # Der geteilte Schichtenspeicher macht daraus einen Bau: der
      # Release-Schritt setzt genau die Schichten zusammen, die eben getestet
      # worden sind. Dass es schneller wird, ist die Folge und nicht der Grund
      # - besonders bei arm64, das hier unter QEMU laeuft.
      #
      # Ein eigener `scope` je Bild, damit Home und Relay einander nicht
      # ueberschreiben.
      - name: Build local amd64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/home.Dockerfile
          cache-from: type=gha,scope=home
          cache-to: type=gha,mode=max,scope=home
          load: true
          platforms: linux/amd64
          tags: pico-home:amd64-test

      - name: Smoke-test amd64 container health endpoint and dashboard
        run: |
          docker run --rm -d --name pico-home-smoke-amd64 -p 3100:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -e PICO_FOUNDATION_TOKEN=ci-smoke-token pico-home:amd64-test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/health && curl -fsS http://127.0.0.1:3100/ | grep -q "Pico Home Foundation Dashboard"; then
              docker stop pico-home-smoke-amd64
              exit 0
            fi
            sleep 1
          done
          docker logs pico-home-smoke-amd64 || true
          docker stop pico-home-smoke-amd64 || true
          exit 1

      - name: Smoke-test amd64 add-on foundation token option
        run: |
          mkdir -p /tmp/pico-addon-options-amd64
          printf '{"pico_foundation_token":"ci-token"}\n' > /tmp/pico-addon-options-amd64/options.json
          docker run --rm -d --name pico-home-token-amd64 -p 3102:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -v /tmp/pico-addon-options-amd64:/data pico-home:amd64-test
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3102/health; then
              status_without_token=$(curl -sS -o /tmp/pico-token-amd64-without-token.txt -w '%{http_code}' http://127.0.0.1:3102/api/system/status || true)
              if [ "$status_without_token" = "401" ] && curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:3102/api/system/status | grep -q '"service":"pico-home-core"'; then
                docker stop pico-home-token-amd64
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs pico-home-token-amd64 || true
          docker stop pico-home-token-amd64 || true
          exit 1

      - name: Build local arm64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/home.Dockerfile
          cache-from: type=gha,scope=home
          cache-to: type=gha,mode=max,scope=home
          load: true
          platforms: linux/arm64
          tags: pico-home:arm64-test

      - name: Smoke-test arm64 container health endpoint and dashboard
        run: |
          docker run --platform linux/arm64 --rm -d --name pico-home-smoke-arm64 -p 3101:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -e PICO_FOUNDATION_TOKEN=ci-smoke-token pico-home:arm64-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health && curl -fsS http://127.0.0.1:3101/ | grep -q "Pico Home Foundation Dashboard"; then
              docker stop pico-home-smoke-arm64
              exit 0
            fi
            sleep 1
          done
          docker logs pico-home-smoke-arm64 || true
          docker stop pico-home-smoke-arm64 || true
          exit 1

      - name: Smoke-test arm64 add-on foundation token option
        run: |
          mkdir -p /tmp/pico-addon-options-arm64
          printf '{"pico_foundation_token":"ci-token"}\n' > /tmp/pico-addon-options-arm64/options.json
          docker run --platform linux/arm64 --rm -d --name pico-home-token-arm64 -p 3103:3100 -e PICO_FOUNDATION_ACCESS_MODE=direct-token -v /tmp/pico-addon-options-arm64:/data pico-home:arm64-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3103/health; then
              status_without_token=$(curl -sS -o /tmp/pico-token-arm64-without-token.txt -w '%{http_code}' http://127.0.0.1:3103/api/system/status || true)
              if [ "$status_without_token" = "401" ] && curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:3103/api/system/status | grep -q '"service":"pico-home-core"'; then
                docker stop pico-home-token-arm64
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs pico-home-token-arm64 || true
          docker stop pico-home-token-arm64 || true
          exit 1

      - name: Build and optionally push multi-arch release image
        id: release_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/home.Dockerfile
          cache-from: type=gha,scope=home
          cache-to: type=gha,mode=max,scope=home
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ADR 0122 Y2. Provenance from the platform's own Sigstore-backed
      # tooling. No Pico-held signing key is created, deliberately: for every
      # consumption path that exists today the update authority is already
      # repository plus registry write access, and a key Pico held would add a
      # ceremony without moving that root of trust.
      #
      # Conditional on the repository being public, because GitHub refuses to
      # store an attestation for a user-owned private repository:
      #
      #   Failed to persist attestation: Feature not available for user-owned
      #   private repositories.
      #
      # That is a platform limit, not a build failure, and the two must not
      # look the same. Failing every push would make a wall out of a gate;
      # skipping quietly would let a build with no provenance look like one
      # that has it. So it is skipped and said out loud in the job summary,
      # in the ADR 0119 Q5 posture: told while there is still room to act.
      #
      # The two things that would actually produce provenance are a public
      # repository or an organisation-owned one. Both are decisions about the
      # project rather than about this file.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/riederch/pico/home
          subject-digest: ${{ steps.release_image.outputs.digest }}
          push-to-registry: true

      # ADR 0122 Y2. The skip is recorded where a person reading the run will
      # meet it, rather than being inferable from a step that is not there.
      - name: Report that build provenance was not attested
        if: github.event_name != 'pull_request' && github.event.repository.private == true
        run: |
          {
            echo "### Build provenance: not attested"
            echo
            echo "This image carries **no build-provenance attestation**."
            echo "GitHub does not store attestations for user-owned private"
            echo "repositories, so ADR 0122 Y2 is unmet for this build."
            echo
            echo "Provenance would require a public repository or an"
            echo "organisation-owned one. Until then, the update authority for"
            echo "every consumption path is repository plus registry write"
            echo "access, unattested."
          } >> "$GITHUB_STEP_SUMMARY"

      # ADR 0122 Y3. The digest the release notes have to record, produced by
      # the build rather than copied by hand from a terminal.
      - name: Report the published digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/riederch/pico/home@${{ steps.release_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  relay_image:
    name: Build and smoke-test the Pico Relay container
    runs-on: ubuntu-latest
    needs: [verify, suites]
    # ADR 0153. A second published image, so a second set of the permissions
    # ADR 0122 Y1/Y2 put on the job that publishes rather than on the workflow.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ADR 0122 Y4, per image. The relay's tag history is its own, so the
      # check runs against the relay's repository rather than the Home's.
      - name: Verify the release neither republishes nor downgrades
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PICO_RELEASE_IMAGE: ghcr.io/riederch/pico/relay
        run: node scripts/check-release-monotonic.mjs

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/riederch/pico/relay
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      # Dasselbe wie beim Home-Bild darueber, und aus demselben Grund
      # (ADR 0153 PK6, Befund B67): rauchgetestet und veroeffentlicht war bis
      # zum 2026-09-05 nicht dasselbe Bild. Eigener `scope`, damit die beiden
      # Bilder einander nicht ueberschreiben.
      - name: Build local amd64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/relay.Dockerfile
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
          load: true
          platforms: linux/amd64
          tags: pico-relay:amd64-test

      # ADR 0153 PK2/PK3/PK7 with ADR 0154 RO2/RO7. What a deliverable owes:
      # it refuses to start unconfigured, it answers a health check on its own
      # port, the public port stays a surface with no map of itself, and it
      # says which empty state it is in - nobody has claimed it, then claimed
      # and holding no accounts - rather than looking broken in either.
      - name: Smoke-test the relay container
        run: |
          set -euo pipefail

          # Not `--rm`: the container is restarted below, and one cleanup path
          # for every exit is easier to keep true than five.
          trap 'docker rm --force pico-relay-smoke >/dev/null 2>&1 || true' EXIT
          logs=/tmp/relay-log.txt

          # Every check names its own failure. The one that broke last was a
          # bare `grep -q` under `set -e`, which ended the job with no line in
          # it at all - and a red with nothing in it reads as a broken image.
          die() {
            echo "$1" >&2
            docker logs pico-relay-smoke || true
            exit 1
          }

          # PK2: no operator, no relay. A guessed hostname would issue
          # addresses pointing at somebody else's machine.
          #
          # And the refusal has to be that one. A name still in use, a missing
          # image or a container the kernel killed all exit non-zero too, and
          # a check that reads any of them as "it refused correctly" is a
          # check that passes hardest when the least is working.
          if docker run --rm --name pico-relay-unconfigured pico-relay:amd64-test >"$logs" 2>&1; then
            cat "$logs"
            echo "the relay started without PICO_RELAY_OPERATOR" >&2
            exit 1
          fi
          grep -q PICO_RELAY_OPERATOR "$logs" || {
            cat "$logs"
            echo "the relay did not start, but not over the operator hostname it refuses to guess" >&2
            exit 1
          }

          docker run -d --name pico-relay-smoke \
            -p 3200:3200 \
            -e PICO_RELAY_OPERATOR=relay.ci.invalid \
            pico-relay:amd64-test

          # PK3: the health port is not published, so the check runs inside
          # the container - which is the deployment shape it is built for.
          healthy() {
            for _ in $(seq 1 30); do
              if docker exec pico-relay-smoke node -e "fetch('http://127.0.0.1:3201/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1)).catch(()=>process.exit(1))"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          healthy || die "the relay never answered its own health port"

          # PK3 again, from the outside: the public port must answer a health
          # probe exactly as it answers any unknown route.
          unknown=$(curl -sS -o /tmp/relay-unknown.txt -w '%{http_code}' http://127.0.0.1:3200/nothing-here)
          health=$(curl -sS -o /tmp/relay-health.txt -w '%{http_code}' http://127.0.0.1:3200/health)
          if [ "$unknown" != "$health" ] || ! cmp -s /tmp/relay-unknown.txt /tmp/relay-health.txt; then
            die "the public port tells a health probe apart from an unknown route"
          fi

          # A boot log line, waited for rather than sampled: the health port
          # opens before the boot log is written, so reading the log the
          # moment health answers is a race.
          #
          # And read through a file, never as `docker logs | grep -q`, which
          # is what the old check did. Under `pipefail` that pipeline reports
          # a failure for a line that is there: `grep -q` exits at the first
          # match, `docker logs` takes SIGPIPE writing what is left, and the
          # shell sees 141. Measured while writing this: match on the last
          # line, it passes; anything after the match, and it said not-found
          # 40 times out of 40. A check that works until the log grows.
          said() {
            for _ in $(seq 1 30); do
              docker logs pico-relay-smoke >"$logs" 2>&1
              if grep -q "$1" "$logs"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          # ADR 0154 RO2. Nobody has claimed this relay, and its log is the
          # channel a container has for saying so: whoever can read it can
          # already stop the process.
          said '"event":"relay_unclaimed"' \
            || die "a relay nobody has claimed said nothing about it"
          claim=$(grep -o '"claimCode":"[^"]*"' "$logs" | tail -1 | cut -d'"' -f4 || true)
          [ -n "$claim" ] || die "a relay nobody has claimed printed no claim code"

          # RO7. The administration port is on loopback, so the claim is made
          # from inside the container - the shape an operator reaches through a
          # transport they chose, rather than a fourth published port.
          docker exec pico-relay-smoke node -e "
            fetch('http://127.0.0.1:3202/operator/claim', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ claimCode: process.argv[1] }),
            }).then((r) => r.json()).then((body) => {
              if (typeof body.credential !== 'string') { throw new Error(JSON.stringify(body)); }
            }).catch((error) => { console.error(String(error)); process.exit(1); });
          " "$claim" || die "the code the log printed did not claim the relay"

          # PK7 on the boot that can say it. A relay nobody has claimed talks
          # about the claim instead, because accounts are not yet what stands
          # between it and being useful. The restart is also the only check
          # that the database survived one: a relay that had forgotten the
          # claim would mint a second code here, into a log.
          docker restart pico-relay-smoke >/dev/null
          healthy || die "the relay did not come back from a restart"
          said relay_accounts_unprovisioned \
            || die "a claimed relay holding no accounts did not say so"
          codes=$(grep -c '"event":"relay_unclaimed"' "$logs" || true)
          [ "$codes" = "1" ] || die "the claim did not survive the restart ($codes claim codes)"

          # A green step that says what it proved, because the next person to
          # read this job will be reading it in a hurry.
          echo "ADR 0153 PK2/PK3: refuses to start unconfigured, answers health on its own port, and gives an unknown route the answer it gives /health."
          echo "ADR 0154 RO2/RO7 with PK7: claimed over loopback with the code from its own log; the claim survived a restart, and it then says it holds no accounts."

      - name: Build local arm64 smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/relay.Dockerfile
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
          load: true
          platforms: linux/arm64
          tags: pico-relay:arm64-test

      - name: Smoke-test the arm64 relay container
        run: |
          set -euo pipefail
          docker run --platform linux/arm64 --rm -d --name pico-relay-arm64 \
            -e PICO_RELAY_OPERATOR=relay.ci.invalid \
            pico-relay:arm64-test
          ok=0
          for i in $(seq 1 40); do
            if docker exec pico-relay-arm64 node -e "fetch('http://127.0.0.1:3201/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1)).catch(()=>process.exit(1))"; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs pico-relay-arm64 || true
          docker stop pico-relay-arm64 || true
          [ "$ok" = "1" ]

      - name: Build and optionally push multi-arch release image
        id: release_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/relay.Dockerfile
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/riederch/pico/relay
          subject-digest: ${{ steps.release_image.outputs.digest }}
          push-to-registry: true

      # ADR 0122 Y2. Said per artifact rather than once: a reader of this run
      # needs to know which of the published things carries provenance, and
      # "one of them was skipped" is not an answer.
      - name: Report that build provenance was not attested
        if: github.event_name != 'pull_request' && github.event.repository.private == true
        run: |
          {
            echo "### Pico Relay build provenance: not attested"
            echo
            echo "GitHub does not store attestations for user-owned private"
            echo "repositories, so ADR 0122 Y2 is unmet for this image too."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the published digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/riederch/pico/relay@${{ steps.release_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  client_package:
    name: Publish the Pico Client package
    runs-on: ubuntu-latest
    needs: [verify, suites]
    # Only on a tag. `main` builds the package and verifies it on every push;
    # what a tag adds is a place to download it from, and a release asset that
    # appeared on every commit would make "released" mean nothing.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ADR 0153 PK6. Downloaded rather than rebuilt: this is the exact package
      # `release:verify` took apart and checked. A second build would produce
      # a different file with the same name, and the checksum below would then
      # attest to something nobody verified.
      - name: Take the verified client package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pico-client-linux-amd64
          path: client-package

      - name: Verify the checksum that travelled with it
        run: |
          set -euo pipefail
          cd client-package
          sha256sum --check ./*.deb.sha256
          ls -l

      - name: Attest the package's provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: client-package/*.deb

      - name: Report that package provenance was not attested
        if: github.event.repository.private == true
        run: |
          {
            echo "### Pico Client build provenance: not attested"
            echo
            echo "GitHub does not store attestations for user-owned private"
            echo "repositories, so ADR 0122 Y2 is unmet for this package."
            echo "The checksum published beside it says which bytes were"
            echo "verified; it does not say who built them."
          } >> "$GITHUB_STEP_SUMMARY"

      # `gh` rather than a release action: one fewer third-party action to pin,
      # and the token it uses is the one this job already has.
      - name: Attach the package to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Pico $tag" --draft
          fi
          gh release upload "$tag" client-package/*.deb client-package/*.deb.sha256 --clobber
          echo "### Published client package" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat client-package/*.deb.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
