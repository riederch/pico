name: Pico Core
version: "0.1.7"
slug: pico_core
description: Local-first personal AI companion core for Home Assistant.
url: https://github.com/riederch/pico
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
image: ghcr.io/riederch/pico/core
ingress: true
ingress_port: 3100
ingress_entry: /
ingress_stream: true
panel_title: Pico Core
panel_admin: true
options:
  pico_foundation_token: null
schema:
  pico_foundation_token: password?
ports:
  3100/tcp: null
ports_description:
  3100/tcp: Pico Core internal ingress, API and WebSocket endpoint
watchdog: "http://[HOST]:[PORT:3100]/health"
# Memory Domain Content Keys live under /data/keys and must never share a
# backup artifact with the database (ADR 0072 R6). Excluding them from add-on
# backups is what makes future crypto-shredding real. Keys are not recoverable
# from a data backup by design; recovery is a deliberate, separate key export.
backup_exclude:
  - keys/**
  - keys
