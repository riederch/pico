name: Pico Core
version: "0.1.7"
slug: pico_core
description: Local-first personal AI companion core for Home Assistant.
url: https://github.com/riederch/pico
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
image: ghcr.io/riederch/pico/core
ingress: true
ingress_port: 3100
ingress_entry: /
ingress_stream: true
panel_title: Pico Core
panel_admin: true
options:
  pico_foundation_token: null
schema:
  pico_foundation_token: password?
ports:
  3100/tcp: 3100
ports_description:
  3100/tcp: Pico Core API and WebSocket endpoint
webui: "http://[HOST]:[PORT:3100]"
watchdog: "http://[HOST]:[PORT:3100]/health"
